<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Icons Design Options</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        :root {
            --bg-color: #0d0d12;
            --text-main: #ffffff;
            --primary: #f15a24; /* Signature Orange */
        }
        
        body {
            margin: 0;
            padding: 4rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 5rem;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .option-container {
            position: relative;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .option-title {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #f15a24;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ICONS */
        .pill-icon, .social-icon {
            color: rgba(255,255,255,0.6);
            transition: all 0.3s ease;
        }
        .pill-icon:hover, .social-icon:hover {
            color: var(--primary);
            transform: translateY(-5px);
        }

        /* Option 7 (Creative Pill) */
        .creative-pill {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 155px; /* Initial width */
            height: 55px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .creative-pill:hover {
            width: 300px;
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }
        .pill-text {
            position: absolute;
            left: 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: white;
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
        }
        .creative-pill:hover .pill-text {
            opacity: 0;
            transform: translateX(-20px);
        }
        .pill-icons {
            position: absolute;
            left: 2rem;
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transition-delay: 0.1s;
        }
        .creative-pill:hover .pill-icons {
            opacity: 1;
            transform: translateX(0);
        }

        /* Option 6 (Node) */
        .network-node {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .node-line {
            width: 40px;
            height: 2px;
            background: rgba(255,255,255,0.2);
            position: relative;
        }
        .node-line::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
